name: Java Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: 'windows-latest'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@2a69be27b0baa8a7ec1c0ba665dc022b180664c5
        with:
          cache: maven
          distribution: temurin
          java-version: 27
          mvn-server-repository-origins: central:https://central.sonatype.com
          server-id: central
          server-username-env-var: CI_DEPLOY_USERNAME
          server-password-env-var: CI_DEPLOY_PASSWORD
          gpg-private-key: ${{ secrets.SIGNING_KEY }}
          gpg-passphrase-env-var: ${{ secrets.SIGNING_PASSWORD }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      - name: Verify with Maven
        if: github.repository_owner == 'spotbugs' && github.event_name == 'push'
        run: ./mvnw -B verify -D"org.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
        env:
          MAVEN_GPG_KEY_NAME: ${{ secrets.SIGNING_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.SIGNING_PASSWORD }}
      - name: Verify with Maven
        if: github.repository_owner != 'spotbugs' || (github.repository_owner == 'spotbugs' && github.event_name != 'push')
        run: ./mvnw -B verify -D"org.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn" -D"gpg.skip=true"
      - name: NPM CI
        run: npm ci
      - name: Copy Maven settings
        if: github.repository_owner == 'spotbugs' && github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: bash
        run: cp ~/.m2/settings.xml ./maven_settings.xml
      - name: NPM Exec Semantic Release
        if: github.repository_owner == 'spotbugs' && github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: npm exec semantic-release
        env:
          CI_DEPLOY_USERNAME: ${{ secrets.CI_DEPLOY_USERNAME }}
          CI_DEPLOY_PASSWORD: ${{ secrets.CI_DEPLOY_PASSWORD }}
          MAVEN_GPG_KEY_NAME: ${{ secrets.SIGNING_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.SIGNING_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
